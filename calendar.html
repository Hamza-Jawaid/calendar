<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency Calendar Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        agencyBlue: '#1a237e', /* Matches the deep navy in your PDF header */
                        agencyGold: '#fbc02d', /* Matches the yellow/gold accents */
                        agencyGray: '#f8f9fa',
                    },
                    fontFamily: {
                        sans: ['Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* A4 Paper Dimensions */
        .a4-page {
            width: 210mm;
            height: 297mm;
            background: white;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden; /* Ensures no bleed */
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        
        /* Layout Utilities */
        .preview-scroll { background: #525659; padding: 40px; overflow-y: scroll; height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .editor-scroll { height: 100vh; overflow-y: scroll; }
        
        /* Print Fixes */
        .page-break { page-break-after: always; }
    </style>
</head>
<body class="flex h-screen bg-gray-100" x-data="calendarApp()">

    <div class="w-[400px] bg-white border-r border-gray-200 p-6 editor-scroll z-10 shadow-xl">
        <h2 class="text-xl font-bold text-agencyBlue mb-1">Calendar Builder</h2>
        <p class="text-xs text-gray-500 mb-6">Lightweight • No Database • Fast</p>
        
        <div class="mb-6 border rounded-lg p-4 bg-blue-50">
            <h3 class="font-bold text-agencyBlue text-sm mb-3 flex items-center">
                <span class="w-2 h-2 bg-agencyGold rounded-full mr-2"></span> YOUR AGENCY INFO
            </h3>
            <div class="space-y-2">
                <input type="text" x-model="agency.name" class="w-full text-sm p-2 border rounded" placeholder="Agency Name">
                <input type="text" x-model="agency.email" class="w-full text-sm p-2 border rounded" placeholder="Support Email">
                <input type="text" x-model="agency.website" class="w-full text-sm p-2 border rounded" placeholder="Website">
                <input type="text" x-model="agency.phone" class="w-full text-sm p-2 border rounded" placeholder="Phone">
            </div>
        </div>

        <div class="mb-6 border rounded-lg p-4 bg-yellow-50">
            <h3 class="font-bold text-yellow-800 text-sm mb-3 flex items-center">
                <span class="w-2 h-2 bg-agencyBlue rounded-full mr-2"></span> CLIENT INFO
            </h3>
            <div class="space-y-2">
                <input type="text" x-model="client.name" class="w-full text-sm p-2 border rounded" placeholder="Client Name (e.g. Sister Edma)">
                <div class="flex items-center space-x-2">
                    <span class="text-xs font-bold text-gray-600">Logo:</span>
                    <input type="file" @change="uploadLogo($event)" class="text-xs w-full">
                </div>
            </div>
        </div>

        <div class="mb-8">
            <h3 class="font-bold text-gray-800 mb-3 text-sm border-b pb-2">POSTS CONTENT</h3>
            <template x-for="(post, index) in posts" :key="index">
                <div class="border p-3 rounded mb-3 bg-white shadow-sm hover:shadow-md transition">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-agencyBlue text-sm" x-text="'Post #' + (index + 1)"></span>
                        <button @click="removePost(index)" class="text-red-500 hover:text-red-700 text-xs font-bold">REMOVE</button>
                    </div>
                    
                    <input type="file" @change="uploadPostImage($event, index)" class="mb-2 w-full text-xs">
                    
                    <textarea x-model="post.caption" placeholder="Write caption here..." rows="3" class="w-full text-sm p-2 border rounded mb-2 focus:ring-1 focus:ring-agencyBlue"></textarea>
                    
                    <textarea x-model="post.hashtags" placeholder="#Hashtags" rows="2" class="w-full text-sm p-2 border rounded text-blue-600"></textarea>
                </div>
            </template>
            <button @click="addPost()" class="w-full py-2 bg-agencyBlue text-white text-sm font-bold rounded hover:bg-opacity-90 transition">+ ADD NEW POST</button>
        </div>

        <div class="sticky bottom-0 bg-white pt-4 pb-2 border-t">
            <button @click="generatePDF()" class="w-full py-3 bg-agencyGold text-agencyBlue font-extrabold rounded shadow-lg hover:bg-yellow-400 transition flex justify-center items-center">
                <span x-show="!isGenerating">DOWNLOAD PDF</span>
                <span x-show="isGenerating">PROCESSING...</span>
            </button>
        </div>
    </div>

    <div class="flex-grow preview-scroll" id="preview-container">
        
        <div class="a4-page">
            <div class="h-4 bg-agencyGold w-full"></div>
            
            <div class="flex-grow flex flex-col items-center justify-center p-12 text-center">
                <div class="mb-6">
                    <div class="w-24 h-24 rounded-full bg-agencyBlue flex items-center justify-center text-agencyGold text-4xl font-bold border-4 border-agencyGold">
                        C
                    </div>
                </div>

                <h1 class="text-5xl font-black text-agencyBlue tracking-wide uppercase mb-2">Social Media</h1>
                <h2 class="text-3xl font-light text-gray-600 uppercase tracking-widest mb-12">Content Calendar</h2>
                
                <div class="w-32 h-1 bg-agencyGold mb-12"></div>

                <div class="text-left w-full max-w-md space-y-6">
                    <div>
                        <p class="text-xs text-gray-400 uppercase font-bold tracking-wider">Prepared For:</p>
                        <h3 class="text-2xl font-bold text-gray-800" x-text="client.name"></h3>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 uppercase font-bold tracking-wider">Prepared By:</p>
                        <h3 class="text-2xl font-bold text-agencyBlue" x-text="agency.name"></h3>
                    </div>
                </div>
            </div>

            <div class="bg-agencyBlue h-16 w-full flex justify-between items-center px-10 text-white text-xs font-medium tracking-wide">
                <span x-text="agency.phone"></span>
                <span x-text="agency.email"></span>
                <span x-text="agency.website"></span>
            </div>
        </div>

        <template x-for="(post, index) in posts" :key="index">
            <div class="a4-page">
                <div class="h-20 border-b border-gray-200 flex items-center justify-between px-10 bg-white">
                    <div class="flex items-center gap-3">
                         <template x-if="client.logo">
                            <img :src="client.logo" class="h-10 w-auto object-contain">
                        </template>
                        <span class="font-bold text-gray-700 text-lg uppercase" x-text="client.name"></span>
                    </div>
                    <div class="bg-agencyGold text-agencyBlue font-bold px-4 py-1 rounded-full text-sm shadow-sm">
                        Post #<span x-text="index + 1 < 10 ? '0' + (index + 1) : index + 1"></span>
                    </div>
                </div>

                <div class="flex-grow flex flex-col p-10 gap-6">
                    
                    <div class="w-full flex-grow bg-gray-100 rounded-lg border-2 border-dashed border-gray-300 flex items-center justify-center overflow-hidden relative group">
                        <template x-if="post.image">
                            <img :src="post.image" class="w-full h-full object-contain">
                        </template>
                        <template x-if="!post.image">
                            <div class="text-center">
                                <p class="text-gray-400 font-bold">Design Preview</p>
                                <p class="text-xs text-gray-400">Upload image in sidebar</p>
                            </div>
                        </template>
                    </div>

                    <div class="w-full bg-blue-50 p-6 rounded-l border-l-4 border-agencyBlue">
                        <h4 class="text-agencyBlue font-bold text-sm uppercase mb-3 tracking-wider flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            Caption
                        </h4>
                        <p class="text-gray-700 text-sm leading-relaxed whitespace-pre-wrap break-words font-sans" x-text="post.caption"></p>
                        
                        <div class="mt-4 pt-4 border-t border-blue-100">
                            <p class="text-blue-600 font-medium text-sm whitespace-pre-wrap break-words" x-text="post.hashtags"></p>
                        </div>
                    </div>

                </div>

                <div class="bg-agencyBlue text-white h-12 flex justify-between items-center px-10 text-[10px] tracking-wider mt-auto">
                    <div class="flex items-center gap-4">
                        <span x-text="agency.phone"></span>
                        <span class="w-1 h-1 bg-agencyGold rounded-full"></span>
                        <span x-text="agency.email"></span>
                    </div>
                    <span class="font-bold text-agencyGold" x-text="agency.website"></span>
                </div>
            </div>
        </template>

        <div class="a4-page flex flex-col">
            <div class="flex-grow flex flex-col items-center justify-center p-12 bg-white relative">
                 <div class="absolute top-0 left-0 w-full h-2 bg-agencyGold"></div>

                <div class="w-20 h-20 bg-agencyBlue rounded-full flex items-center justify-center mb-6 shadow-lg">
                    <svg class="w-10 h-10 text-agencyGold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>

                <h1 class="text-6xl font-black text-agencyBlue mb-2">Thank You!</h1>
                <p class="text-xl text-gray-500 mb-10 font-light">We await your feedback & approval.</p>

                <div class="bg-blue-50 p-8 rounded-xl border border-blue-100 text-center w-full max-w-lg">
                    <p class="text-sm text-gray-600 mb-2">For approvals or changes, please contact:</p>
                    <p class="text-xl font-bold text-agencyBlue" x-text="agency.email"></p>
                    <p class="text-lg font-bold text-agencyBlue mt-1" x-text="agency.phone"></p>
                </div>
            </div>
            
             <div class="bg-agencyBlue text-white h-16 flex justify-between items-center px-10 text-xs font-medium">
                <span x-text="agency.phone"></span>
                <span x-text="agency.website"></span>
            </div>
        </div>

    </div>

    <script>
        function calendarApp() {
            return {
                isGenerating: false,
                // AGENCY INFO (Matches your PDF Footer)
                agency: {
                    name: 'Captain Design Agency',
                    email: 'support@captaindesignagency.com',
                    website: 'captaindesignagency.com',
                    phone: '(916) 249-7914'
                },
                // CLIENT INFO (Matches your PDF Header)
                client: {
                    name: 'SISTER EDMA FOUNDATION',
                    logo: null 
                },
                posts: [
                    { 
                        image: null, 
                        caption: 'Wishing you VERY HAPPY HOLIDAYS from Captain Design Agency.\n\nGrateful for your support this year. We hope you take time to rest, recharge, and enjoy the moments that matter most.', 
                        hashtags: '#HappyHolidays #CaptainDesign #SeasonsGreetings' 
                    }
                ],
                addPost() {
                    this.posts.push({ image: null, caption: '', hashtags: '' });
                },
                removePost(index) {
                    this.posts.splice(index, 1);
                },
                uploadLogo(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => { this.client.logo = e.target.result; };
                        reader.readAsDataURL(file);
                    }
                },
                uploadPostImage(event, index) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => { this.posts[index].image = e.target.result; };
                        reader.readAsDataURL(file);
                    }
                },
                async generatePDF() {
                    this.isGenerating = true;
                    window.scrollTo(0,0); // Reset scroll to ensure rendering matches
                    
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('p', 'mm', 'a4');
                    const pages = document.querySelectorAll('.a4-page');
                    
                    for (let i = 0; i < pages.length; i++) {
                        if (i > 0) doc.addPage();
                        
                        await html2canvas(pages[i], {
                            scale: 2, // High resolution
                            useCORS: true,
                            logging: false
                        }).then(canvas => {
                            const imgData = canvas.toDataURL('image/jpeg', 0.8); // 0.8 Quality = Lighter PDF
                            const pdfWidth = doc.internal.pageSize.getWidth();
                            const pdfHeight = doc.internal.pageSize.getHeight();
                            doc.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                        });
                    }
                    
                    doc.save(this.client.name + '_Calendar.pdf');
                    this.isGenerating = false;
                }
            }
        }
    </script>
</body>
</html>
