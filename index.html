<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <!-- Instantly redirects the user -->
  <meta http-equiv="refresh" content="0; url=https://hamza-jawaid.github.io/social-media-presentation-calendar/">
  <!-- Tells Google to pass index equity to the new URL -->
  <link rel="canonical" href="https://hamza-jawaid.github.io/social-media-presentation-calendar/">
</head>
<body>
  <p>Redirecting to the <a href="https://hamza-jawaid.github.io/social-media-presentation-calendar/">new calendar page</a>...</p>
  <script>
    // Fallback JavaScript redirect
    window.location.replace("https://hamza-jawaid.github.io/social-media-presentation-calendar/");
  </script>
</body>
</html>
